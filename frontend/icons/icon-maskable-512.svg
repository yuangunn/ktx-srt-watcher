<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable: full-bleed dark; train + dot within central 80% safe zone (52..460) -->
  <rect width="512" height="512" fill="#0E1014"/>

  <!-- Alert ring/dot -->
  <g transform="translate(360, 156)">
    <circle r="28" fill="none" stroke="#E26B7A" stroke-width="4" opacity="0.35"/>
    <circle r="14" fill="#E26B7A"/>
  </g>

  <!-- Bullet train -->
  <g transform="translate(256, 270)">
    <path d="
      M -150,-52 Q -150,-76 -124,-76 L 60,-76 Q 124,-76 148,-30 L 158,0
      Q 158,28 124,28 L -124,28 Q -150,28 -150,4 Z
    " fill="#ECE7DD"/>
    <path d="
      M 56,-62 Q 108,-62 130,-30 L 134,-8 L 56,-8 Z
    " fill="#0E1014"/>
    <rect x="-130" y="-58" width="32" height="22" rx="4" fill="#0E1014"/>
    <rect x="-92" y="-58" width="32" height="22" rx="4" fill="#0E1014"/>
    <rect x="-54" y="-58" width="32" height="22" rx="4" fill="#0E1014"/>
    <rect x="-16" y="-58" width="32" height="22" rx="4" fill="#0E1014"/>
    <rect x="22" y="-58" width="32" height="22" rx="4" fill="#0E1014"/>
    <circle cx="138" cy="8" r="7" fill="#5BA8E5"/>
  </g>

  <!-- Track -->
  <rect x="106" y="358" width="300" height="5" fill="#5BA8E5"/>
  <rect x="106" y="374" width="300" height="5" fill="#E26B7A"/>
</svg>
