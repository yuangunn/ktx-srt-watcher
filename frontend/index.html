<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- maximum-scale/user-scalable keep the layout pinned like a native app.
       Standalone (home-screen) WebKit honours these; Safari's browser mode
       ignores them, so app.js also blocks the iOS gesture* events. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F2F4F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="발권창구">
  <meta name="description" content="KTX/SRT 취소표 감시 워치 관리">
  <!-- The watch list and poll state are stored here, not in the repo.
       Forks: point this at your own Cloudflare Worker. -->
  <meta name="cf-worker-url" content="https://ktx-srt-watcher-cron.rms6654.workers.dev">
  <title>발권창구</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400..600&display=swap">

  <link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div id="app"></div>

<template id="tpl-setup">
  <main class="setup">
    <section class="setup__card">
      <p class="setup__eyebrow">초기 연결</p>
      <h1 class="setup__title">GitHub 연결</h1>
      <p class="setup__lede">
        "지금 확인"과 실행 기록 조회에 GitHub 접근 권한이 필요합니다.
        Personal Access Token을 발급받아 아래에 붙여 넣으세요. 토큰은 이 기기 <code>localStorage</code>에만 저장됩니다.
      </p>
      <ol class="setup__steps">
        <li>GitHub → <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">Settings → Fine-grained tokens</a> → Generate new token</li>
        <li>Repository access: <strong>Only select repositories</strong> → <code>ktx-srt-watcher</code> 선택</li>
        <li>Permissions → Repository permissions → <strong>Contents: Read-only</strong>, <strong>Actions: Read and write</strong> ("지금 확인" + 최근 실행 목록용)</li>
        <li>발급된 <code>github_pat_…</code> 문자열을 아래에 붙여 넣기</li>
      </ol>
      <p class="setup__lede">
        감시 목록과 폴링 상태는 공개 저장소가 아니라 Cloudflare Worker에 저장됩니다.
        Worker에 설정한 <code>APP_TOKEN</code>과 같은 값을 앱 토큰 칸에 넣어 주세요
        (<code>npx wrangler secret put APP_TOKEN</code>).
      </p>
      <form class="setup__form" id="setup-form" autocomplete="off">
        <label class="field">
          <span class="field__label">Repository</span>
          <input class="field__input" name="repo" placeholder="owner/repo" value="yuangunn/ktx-srt-watcher" required>
        </label>
        <label class="field">
          <span class="field__label">Personal Access Token</span>
          <input class="field__input" name="pat" type="password" placeholder="github_pat_…" required>
        </label>
        <label class="field">
          <span class="field__label">앱 토큰 (Worker APP_TOKEN)</span>
          <input class="field__input" name="app_token" type="password" placeholder="APP_TOKEN" required>
        </label>
        <p class="setup__error" id="setup-error" hidden></p>
        <button class="btn btn--primary" type="submit">연결</button>
      </form>
    </section>
  </main>
</template>

<template id="tpl-shell">
  <div class="app-shell">
  <div class="scroll" id="scroll-body">
    <header class="header">
      <div class="header__title">
        <h1 class="header__name" id="tab-title">발권창구</h1>
        <span class="header__sub" id="header-sub">cancel-seat watcher</span>
      </div>
      <button class="header__refresh" id="refresh-btn" type="button" aria-label="새로고침">↻</button>
    </header>

    <!-- ===== WATCH TAB ===== -->
    <section class="tab-section" id="tab-watch" data-tab="watch">
      <!-- polling hero card -->
      <div class="hero" id="poll-hero">
        <div class="hero__top">
          <span class="hero__status">
            <span class="pulse" id="poll-pulse" data-state="idle" aria-hidden="true"></span>
            <span class="hero__status-label">감시 중</span>
          </span>
          <span class="hero__interval mono" id="poll-interval">—</span>
        </div>
        <div class="hero__count">
          <span class="hero__count-num mono" id="poll-countdown">—</span>
          <span class="hero__count-suffix" id="poll-count-suffix">후 다음 폴링</span>
        </div>
        <div class="hero__actions">
          <button class="hero__check" id="check-now" type="button" data-state="idle"
                  aria-label="지금 확인" aria-live="polite">지금 확인</button>
          <span class="hero__last mono" id="last-run">—</span>
        </div>
      </div>

      <div class="section-head">
        <span class="section-head__label">감시 중인 워치</span>
        <span class="section-head__count mono" id="watch-count">0개</span>
      </div>

      <section class="watches" id="watches" aria-label="감시 중인 워치"></section>
    </section>

    <!-- ===== STATS TAB ===== -->
    <section class="tab-section" id="tab-stats" data-tab="stats" hidden>
      <div class="stats-grid" id="stats-grid"></div>
      <div class="card card--chart">
        <div class="card__label">지난 7일 폴링</div>
        <div class="stats-chart" id="stats-chart" aria-label="지난 7일 일별 폴링 횟수"></div>
      </div>
      <div class="card card--runs">
        <div class="card__label">최근 폴링</div>
        <ul class="run-list" id="run-list" aria-label="최근 실제 폴링"></ul>
      </div>
    </section>

    <!-- ===== SETTINGS TAB ===== -->
    <section class="tab-section" id="tab-settings" data-tab="settings" hidden>

      <!-- ── 알림 ───────────────────────────────────────────── -->
      <div class="section-head"><span class="section-head__label">알림</span></div>

      <div class="card card--rows">
        <div class="card__desc">
          텔레그램은 항상 나갑니다. Pushover는 아이폰의 무음 스위치와 방해금지를 뚫을 수 있는
          유일한 경로입니다 — 텔레그램에는 Apple의 해당 권한이 없습니다.
        </div>
        <div class="toggle-row toggle-row--stack">
          <div class="toggle-row__main">
            <div class="toggle-row__title">알림 테스트</div>
            <div class="toggle-row__desc">
              실제 좌석 발견 알림을 그대로 한 번 발송합니다. 조회도 예약도 하지 않습니다.
              Pushover는 <strong>폰을 무음으로 두고</strong> 눌러 보세요 — 새벽에 실제로 울릴지
              확인하는 유일한 방법입니다.
            </div>
          </div>
          <div class="copy-row">
            <button class="btn btn--ghost btn--sm" type="button" id="test-telegram">텔레그램 테스트</button>
            <button class="btn btn--ghost btn--sm" type="button" id="test-pushover">Pushover 테스트</button>
          </div>
        </div>
        <div class="toggle-row">
          <div class="toggle-row__main">
            <div class="toggle-row__title">집에 있음</div>
            <div class="toggle-row__desc">켜면 긴급 알림이 무음·방해금지를 뚫고 확인할 때까지 반복합니다. 끄면 알림은 오되 무음 스위치를 따릅니다.</div>
          </div>
          <label class="toggle">
            <input class="toggle__input" type="checkbox" id="home-mode-toggle" aria-label="집에 있음">
            <span class="toggle__track"><span class="toggle__thumb"></span></span>
          </label>
        </div>
        <div class="mode-note" id="home-mode-note" hidden>
          <span class="mode-note__text">직접 바꾼 설정을 유지 중입니다 — 단축어 자동 전환은 6시간 동안 무시됩니다.</span>
          <button class="btn btn--ghost btn--sm" type="button" id="home-mode-release">자동에 맡기기</button>
        </div>
        <div class="toggle-row">
          <div class="toggle-row__main">
            <div class="toggle-row__title">빈 결과도 알림</div>
            <div class="toggle-row__desc">잔여석 0건이어도 텔레그램으로 요약 메시지 전송. 수동은 토글과 무관하게 항상 알림.</div>
          </div>
          <label class="toggle">
            <input class="toggle__input" type="checkbox" id="notify-empty-toggle" aria-label="빈 결과 알림">
            <span class="toggle__track"><span class="toggle__thumb"></span></span>
          </label>
        </div>
        <div class="toggle-row">
          <div class="toggle-row__main">
            <div class="toggle-row__title">잔여 있는 동안 계속 알림</div>
            <div class="toggle-row__desc">이미 알린 좌석도 잔여석이 있는 한 폴링마다 다시 알림. 끄면 좌석당 한 번만.</div>
          </div>
          <label class="toggle">
            <input class="toggle__input" type="checkbox" id="renotify-toggle" aria-label="잔여 있는 동안 계속 알림">
            <span class="toggle__track"><span class="toggle__thumb"></span></span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="card__title">조용한 시간 <span class="card__tag mono">KST</span></div>
        <div class="card__desc">이 시간대 cron 알림은 무음으로 전송. 수동·임시예약·마감 알림은 항상 소리. 비워두면 항상 소리.</div>
        <div class="pm-input pm-input--two">
          <div class="pm-input__col">
            <span class="pm-input__label">시작</span>
            <input class="pm-input__box mono" type="time" id="quiet-start" />
          </div>
          <div class="pm-input__col">
            <span class="pm-input__label">종료</span>
            <input class="pm-input__box mono" type="time" id="quiet-end" />
          </div>
        </div>
      </div>

      <!-- ── Pushover ───────────────────────────────────────── -->
      <div class="section-head"><span class="section-head__label">Pushover</span></div>

      <div class="card">
        <div class="card__desc">
          아이폰은 Apple이 <strong>Critical Alerts</strong> 권한을 준 앱만 무음 스위치와
          방해금지를 무시할 수 있습니다. 텔레그램에는 그 권한이 없어서, 알림음을 뭘로 바꾸든
          집중 모드에서 예외로 두든 무음은 뚫리지 않습니다. Pushover에는 있습니다.
        </div>

        <details class="guide">
          <summary class="guide__summary">처음 설정하기 <span class="guide__chev">›</span></summary>
          <ol class="guide__steps">
            <li><strong>App Store에서 Pushover 설치</strong> — 일회성 유료(약 $5)입니다. 구독이 아닙니다.</li>
            <li><strong>앱에서 계정 만들고 로그인</strong> — 로그인해야 기기가 등록되고, 등록 전에는 어떤 알림도 도착하지 않습니다.</li>
            <li><strong>User Key 복사</strong> — <code>pushover.net</code> 에 로그인하면 첫 화면 오른쪽 위에 보이는 30자 문자열입니다.</li>
            <li><strong>API Token 만들기</strong> — <code>pushover.net/apps/build</code> 에서 앱을 하나 생성해야 나옵니다. User Key와는 <em>다른 값</em>입니다.</li>
            <li><strong>⚠️ 아이폰 Pushover 앱 → 설정 → Critical Alerts 허용</strong> — 이걸 켜야 무음이 뚫립니다. 이 단계를 빼면 나머지를 다 해도 새벽에 안 울립니다.</li>
            <li><strong>GitHub 저장소</strong> Settings → Secrets and variables → Actions 에 <code>PUSHOVER_TOKEN</code>(4번), <code>PUSHOVER_USER</code>(3번) 추가</li>
            <li><strong>Cloudflare Worker에도</strong> 같은 값 등록 — 결제 마감 알림이 Worker에서 나갑니다:<br>
              <code>npx wrangler secret put PUSHOVER_TOKEN</code><br>
              <code>npx wrangler secret put PUSHOVER_USER</code></li>
            <li>위 <strong>알림 테스트 → Pushover</strong> 를 <strong>폰 무음 상태로</strong> 눌러 확인</li>
          </ol>
        </details>

        <details class="guide">
          <summary class="guide__summary">단축어로 집/외출 자동 전환 <span class="guide__chev">›</span></summary>
          <p class="guide__note">
            위치 자동화는 아이폰에서 직접 만드는 수밖에 없습니다 — Apple이 트리거 공유를 막아뒀습니다.
            대신 붙여넣을 값은 아래 버튼으로 바로 복사됩니다.
          </p>
          <ol class="guide__steps">
            <li><strong>단축어</strong> 앱 → 아래 <strong>자동화</strong> 탭 → <strong>+</strong> → 새로운 자동화</li>
            <li><strong>도착</strong> 선택 → 위치를 집으로 지정</li>
            <li><strong>즉시 실행</strong> 선택 (실행 전 물어보기는 끄기). 이걸 안 하면 매번 알림을 눌러야 동작합니다.</li>
            <li>동작 검색에서 <strong>URL의 콘텐츠 가져오기</strong> 추가</li>
            <li>URL 칸에 <strong>집 URL 복사</strong> 로 복사한 주소 붙여넣기</li>
            <li>URL 아래 <strong>화살표(▸)</strong> 를 눌러 펼치고 → <strong>방식</strong>을 <code>PUT</code> 으로 변경</li>
            <li><strong>헤더</strong> → 필드 추가 → 키 <code>Authorization</code>, 값에 <strong>Authorization 복사</strong> 로 복사한 값 붙여넣기</li>
            <li>같은 순서로 <strong>떠날 때</strong> 자동화를 하나 더 만들고, URL만 <strong>외출 URL</strong> 로</li>
          </ol>
          <p class="guide__note">
            <strong>직접 바꾼 값이 자동화보다 우선합니다.</strong> 위 토글을 손으로 움직이면
            이후 6시간 동안 자동 전환이 무시됩니다 — 집에 늦게까지 남아 있거나 폰만 두고
            나가는 상황을 위치만으로는 알 수 없기 때문입니다. 바로 자동으로 되돌리려면
            토글 아래의 <strong>자동에 맡기기</strong> 를 누르세요.
          </p>
          <div class="copy-row">
            <button class="btn btn--ghost btn--sm" type="button" id="copy-token">Authorization 복사</button>
            <button class="btn btn--ghost btn--sm" type="button" id="copy-url-home">집 URL 복사</button>
            <button class="btn btn--ghost btn--sm" type="button" id="copy-url-away">외출 URL 복사</button>
          </div>
        </details>
      </div>

      <!-- ── 감시 동작 ──────────────────────────────────────── -->
      <div class="section-head"><span class="section-head__label">감시 동작</span></div>

      <div class="card">
        <div class="card__title">폴링 간격</div>
        <div class="card__desc">최소 10분. 범위·목록 랜덤을 쓰면 매번 다른 간격으로 폴링해 봇 탐지를 피합니다. 실제 정밀도는 CF 트리거 주기(5분) 단위. 수동(지금 확인)은 항상 즉시 동작.</div>
        <div class="seg-track" role="tablist" aria-label="폴링 모드">
          <button class="seg-opt" type="button" data-mode="fixed">고정</button>
          <button class="seg-opt" type="button" data-mode="range">범위 랜덤</button>
          <button class="seg-opt" type="button" data-mode="choices">목록 랜덤</button>
        </div>
        <select class="sr-only" id="poll-mode-select" aria-hidden="true" tabindex="-1">
          <option value="fixed">고정</option>
          <option value="range">범위 랜덤</option>
          <option value="choices">목록 랜덤</option>
        </select>
        <div class="pm-input" id="poll-fixed-field">
          <span class="pm-input__label">간격(분)</span>
          <input class="pm-input__box mono" type="number" inputmode="numeric" min="10" step="1" id="poll-fixed-input" placeholder="30" aria-label="고정 간격(분)" />
        </div>
        <div class="pm-input pm-input--two" id="poll-range-field" hidden>
          <div class="pm-input__col" id="poll-range-min-field">
            <span class="pm-input__label">최소(분)</span>
            <input class="pm-input__box mono" type="number" inputmode="numeric" min="10" step="1" id="poll-range-min" placeholder="27" aria-label="범위 최소(분)" />
          </div>
          <div class="pm-input__col" id="poll-range-max-field">
            <span class="pm-input__label">최대(분)</span>
            <input class="pm-input__box mono" type="number" inputmode="numeric" min="10" step="1" id="poll-range-max" placeholder="29" aria-label="범위 최대(분)" />
          </div>
        </div>
        <div class="pm-input" id="poll-choices-field" hidden>
          <span class="pm-input__label">목록(분, 쉼표)</span>
          <input class="pm-input__box mono" type="text" inputmode="numeric" id="poll-choices-input" placeholder="27, 42, 36" aria-label="간격 목록(분, 쉼표로 구분)" />
        </div>
      </div>

      <div class="card card--rows">
        <div class="toggle-row">
          <div class="toggle-row__main">
            <div class="toggle-row__title">대기예약 자동 등록</div>
            <div class="toggle-row__desc">매진 좌석에 코레일 try_waiting / SRT reserve_standby로 대기 등록. 임시예약과 동시 진행.</div>
          </div>
          <label class="toggle">
            <input class="toggle__input" type="checkbox" id="allow-waiting-toggle" aria-label="대기예약 자동 등록">
            <span class="toggle__track"><span class="toggle__thumb"></span></span>
          </label>
        </div>
      </div>

      <!-- ── 시스템 ─────────────────────────────────────────── -->
      <div class="section-head"><span class="section-head__label">시스템</span></div>

      <div class="card" id="health-card">
        <div class="card__title">시스템 상태
          <button class="health__refresh" id="health-refresh" type="button" aria-label="상태 새로고침">↻</button>
        </div>
        <div class="card__desc">폴링·워크플로·CF Worker·토큰이 정상인지 한눈에 확인합니다.</div>
        <ul class="health" id="health-list" aria-live="polite"></ul>
        <div class="health__fails" id="health-fails" hidden>
          <div class="health__fails-label">최근 실패</div>
          <ul class="health__fails-list" id="health-fails-list"></ul>
        </div>
      </div>

      <div class="card card--rows">
        <div class="toggle-row">
          <div class="toggle-row__main">
            <div class="toggle-row__title">다크 모드</div>
            <div class="toggle-row__desc">라이트/다크 테마 전환. 이 기기에만 저장됩니다.</div>
          </div>
          <label class="toggle">
            <input class="toggle__input" type="checkbox" id="theme-toggle" aria-label="다크 모드">
            <span class="toggle__track"><span class="toggle__thumb"></span></span>
          </label>
        </div>
      </div>
    </section>
  </div>

  <button class="fab" id="fab-add" type="button" aria-label="워치 추가">
    <span class="fab__plus" aria-hidden="true">＋</span>
    <span class="fab__label">워치 추가</span>
  </button>

  <!-- bottom tab bar -->
  <nav class="tabbar" aria-label="주 메뉴">
    <button class="tabbar__item" type="button" data-tab="watch" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="6" width="16" height="2.4" rx="1.2" fill="currentColor"/><rect x="4" y="11" width="16" height="2.4" rx="1.2" fill="currentColor"/><rect x="4" y="16" width="10" height="2.4" rx="1.2" fill="currentColor"/></svg>
      <span class="tabbar__label">워치</span>
    </button>
    <button class="tabbar__item" type="button" data-tab="stats">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="13" width="4" height="7" rx="1.4"/><rect x="10" y="8" width="4" height="12" rx="1.4"/><rect x="16" y="4" width="4" height="16" rx="1.4"/></svg>
      <span class="tabbar__label">통계</span>
    </button>
    <button class="tabbar__item" type="button" data-tab="settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="6.5" width="16" height="2.4" rx="1.2"/><circle cx="9" cy="7.7" r="3"/><rect x="4" y="15.1" width="16" height="2.4" rx="1.2"/><circle cx="15" cy="16.3" r="3"/></svg>
      <span class="tabbar__label">설정</span>
    </button>
  </nav>
  </div>

  <dialog class="sheet" id="log-sheet">
    <div class="sheet__form sheet__form--logs">
      <header class="sheet__header">
        <button class="icon-btn" type="button" id="log-close" aria-label="닫기">×</button>
        <h2 class="sheet__title">실행 로그</h2>
        <a class="icon-btn" id="log-external" target="_blank" rel="noopener" aria-label="GitHub에서 보기">↗</a>
      </header>
      <p class="log-meta mono" id="log-meta">—</p>
      <pre class="log-content mono" id="log-content">—</pre>
    </div>
  </dialog>

  <dialog class="sheet" id="sheet">
    <form class="sheet__form" method="dialog" id="watch-form" autocomplete="off">
      <header class="sheet__header">
        <button class="icon-btn" type="button" id="sheet-close" aria-label="닫기">×</button>
        <h2 class="sheet__title" id="sheet-title">새 워치</h2>
        <span class="sheet__filler" aria-hidden="true"></span>
      </header>

      <fieldset class="seg" aria-label="제공자">
        <legend class="field__label">제공자</legend>
        <div class="seg__track">
          <label class="seg__opt"><input type="radio" name="provider" value="korail" checked><span data-prov="korail">KORAIL · KTX</span></label>
          <label class="seg__opt"><input type="radio" name="provider" value="srt"><span data-prov="srt">SRT</span></label>
        </div>
      </fieldset>

      <div class="row row--2">
        <label class="field">
          <span class="field__label">출발</span>
          <select class="field__input field__input--select" name="from" required></select>
        </label>
        <label class="field">
          <span class="field__label">도착</span>
          <select class="field__input field__input--select" name="to" required></select>
        </label>
      </div>

      <label class="field">
        <span class="field__label">날짜</span>
        <input class="field__input field__input--mono" name="date" type="date" required>
      </label>

      <div class="row row--2">
        <label class="field">
          <span class="field__label">최저 시간</span>
          <input class="field__input field__input--mono" name="time_min" type="time" value="09:00" required>
        </label>
        <label class="field">
          <span class="field__label">최대 시간</span>
          <input class="field__input field__input--mono" name="time_max" type="time" value="12:00" required>
        </label>
      </div>

      <fieldset class="check-group" id="train-type-group" aria-label="열차 종류">
        <legend class="field__label">열차 종류</legend>
      </fieldset>

      <div class="row row--3">
        <label class="field">
          <span class="field__label">성인</span>
          <input class="field__input field__input--mono" name="adult" type="number" min="0" max="9" value="1">
        </label>
        <label class="field">
          <span class="field__label">아동</span>
          <input class="field__input field__input--mono" name="child" type="number" min="0" max="9" value="0">
        </label>
        <label class="field">
          <span class="field__label">경로</span>
          <input class="field__input field__input--mono" name="senior" type="number" min="0" max="9" value="0">
        </label>
      </div>

      <fieldset class="seg" aria-label="좌석 등급">
        <legend class="field__label">좌석 등급</legend>
        <div class="seg__track">
          <label class="seg__opt"><input type="radio" name="seat_class" value="general" checked><span>일반</span></label>
          <label class="seg__opt"><input type="radio" name="seat_class" value="special"><span>특실</span></label>
          <label class="seg__opt"><input type="radio" name="seat_class" value="any"><span>둘 다</span></label>
        </div>
      </fieldset>

      <div class="setting-row setting-row--inline">
        <div class="setting-row__main">
          <span class="setting-row__title">자동 예약</span>
          <span class="setting-row__hint">좌석 발견 즉시 20분 임시 예약을 잡습니다. 결제는 코레일톡/SR 앱에서 직접.</span>
        </div>
        <label class="toggle">
          <input class="toggle__input" type="checkbox" name="auto_reserve" aria-label="자동 예약">
          <span class="toggle__track"><span class="toggle__thumb"></span></span>
        </label>
      </div>

      <p class="sheet__error" id="sheet-error" hidden></p>

      <div class="sheet__actions">
        <button class="btn btn--ghost" type="button" id="sheet-cancel">취소</button>
        <button class="btn btn--primary" type="submit" id="sheet-submit">저장</button>
      </div>
    </form>
  </dialog>

</template>

<template id="tpl-watch">
  <article class="watch" data-watch-id="" data-provider="" data-active="">
    <div class="watch__head">
      <span class="watch__stamp" aria-hidden="true"></span>
      <div class="watch__headmain">
        <div class="watch__tags">
          <span class="badge badge--provider"></span>
          <span class="badge badge--auto-reserve" hidden>자동예약</span>
        </div>
        <h3 class="watch__route">
          <span class="watch__from"></span>
          <span class="watch__arrow" aria-hidden="true">→</span>
          <span class="watch__to"></span>
        </h3>
      </div>
    </div>
    <p class="watch__date mono"></p>
    <div class="watch__meta">
      <span class="watch__chip watch__chip--time mono"></span>
      <span class="watch__meta-types"></span>
      <span class="watch__chip watch__chip--pax"></span>
    </div>
    <hr class="watch__divider" aria-hidden="true">
    <footer class="watch__foot">
      <span class="watch__last-check mono"></span>
      <div class="watch__controls">
        <button class="watch__edit" type="button">수정</button>
        <button class="watch__delete" type="button" aria-label="삭제">삭제</button>
        <label class="toggle">
          <input class="toggle__input" type="checkbox" aria-label="활성화">
          <span class="toggle__track"><span class="toggle__thumb"></span></span>
        </label>
      </div>
    </footer>
  </article>
</template>

<template id="tpl-empty">
  <div class="empty">
    <span class="empty__rail" aria-hidden="true"></span>
    <p class="empty__text">아직 워치가 없습니다</p>
    <span class="empty__rail" aria-hidden="true"></span>
    <button class="btn btn--primary" id="empty-add" type="button">첫 워치 추가하기</button>
  </div>
</template>

<template id="tpl-run-row">
  <li class="run-row">
    <span class="run-row__status" data-conclusion="" aria-hidden="true"></span>
    <div class="run-row__body">
      <p class="run-row__time mono"></p>
      <p class="run-row__meta mono"></p>
    </div>
    <a class="run-row__link" target="_blank" rel="noopener" aria-label="GitHub Actions에서 보기">↗</a>
  </li>
</template>

<script src="./js/app.js" type="module"></script>
</body>
</html>
