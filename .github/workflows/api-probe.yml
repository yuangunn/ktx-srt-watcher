name: api-probe

# Manual diagnostic for the 코레일+ API migration. All logic lives in
# scripts/api_probe.py so it can be iterated on a branch: dispatching with a
# branch ref runs that branch's copy. Public logs — the script prints counts
# and train-type names only, never anything from the user's config.

on:
  workflow_dispatch:
    inputs:
      run_probe:
        description: "Also run the live login+search probe"
        type: boolean
        default: false
      runner:
        description: "Where to run. 코레일+ blocks datacenter IPs, so live probes only tell the truth from korail-home."
        type: choice
        options: [korail-home, ubuntu-latest]
        default: korail-home

permissions:
  contents: read

concurrency:
  group: api-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ${{ inputs.runner == 'korail-home' && fromJSON('["self-hosted","korail-home"]') || inputs.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect / install / probe
        env:
          PROBE: ${{ inputs.run_probe && '1' || '0' }}
          KORAIL_ID: ${{ secrets.KORAIL_ID }}
          KORAIL_PW: ${{ secrets.KORAIL_PW }}
        # A venv because a self-hosted device's system python is often
        # PEP 668 externally-managed and refuses bare pip installs.
        run: |
          python3 -m venv .venv
          .venv/bin/python scripts/api_probe.py
