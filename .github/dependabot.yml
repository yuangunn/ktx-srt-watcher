# Dependency bumps arrive as PRs so tests.yml runs before anything reaches
# the home runner. curl-cffi is pinned in requirements.txt for exactly this
# reason — see the comment there. pykorail is a vendored wheel (it was deleted
# from PyPI), so Dependabot has nothing to propose for it: vendor/README.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # pykorail's fingerprints are tuned against a curl-cffi release, so a
      # bump here is the riskiest one: api-probe on korail-home before merging.
      korail-client:
        patterns: ["curl-cffi", "curl_cffi"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
