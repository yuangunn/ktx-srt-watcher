name = "ktx-srt-watcher-cron"
main = "src/index.js"
compatibility_date = "2026-04-30"

# Fires the watcher every 30 minutes — safely under the GHA private/free
# tier's 2,000 min/month cap (since every run is billed for at least one
# whole minute regardless of actual duration).  Manual "지금 확인" /
# workflow_dispatch is unaffected by this rate.  Tighten only when you've
# moved off GHA free tier or made the repo public.
[triggers]
crons = ["*/30 * * * *"]

[vars]
GITHUB_REPO = "yuangunn/ktx-srt-watcher"
EVENT_TYPE = "cron-tick"
# GITHUB_TOKEN is set via:  npx wrangler secret put GITHUB_TOKEN
# Required scopes (fine-grained PAT, only this repo):
#   - Contents: Read and write
#   - Actions:  Read and write

[observability]
enabled = true
head_sampling_rate = 1
